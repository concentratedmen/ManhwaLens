name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle itself, so no gradle-wrapper.jar is required in the repo.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug + release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ManhwaLensEN-apks
          path: app/build/outputs/apk/**/*.apk
